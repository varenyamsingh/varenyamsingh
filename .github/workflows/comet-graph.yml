
name: Generate Animated Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Generate animated contribution SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: varenyamsingh
          outputs: |
            dist/comet-graph.svg?palette=github-dark&color_snake=%2300e5ff

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
