
name: Generate Animated Contribution Graph

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Render galaxy-style comet graph
        uses: kiaquila/comet-contribution-graph@v2
        with:
          username: varenyamsingh
          layout: orbit
          reduced: "true"
